version: '3.8'

services:
  guax:
    build: ./app
    image: guax:latest
    container_name: guax
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - /volume1/media:/media:ro   # 可选：挂载你的影视库（只读）
    environment:
      - TZ=Asia/Shanghai
