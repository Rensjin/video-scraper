services:
  guax:
    build: .
    image: guax:latest
    container_name: guax
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - /volume1/media:/media:ro   # 可选：挂载影视库（只读），按需调整
    environment:
      - TZ=Asia/Shanghai
